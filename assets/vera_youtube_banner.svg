<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2d2a6e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="2560" height="1440" fill="url(#bgGrad)"/>

  <!-- Glow central -->
  <ellipse cx="1280" cy="720" rx="900" ry="500" fill="url(#glowCenter)"/>

  <!-- Estrelas de fundo (pequenas) -->
  <g fill="white" opacity="0.4">
    <circle cx="120" cy="80" r="1.5"/><circle cx="340" cy="160" r="1"/><circle cx="560" cy="60" r="2"/>
    <circle cx="780" cy="130" r="1.5"/><circle cx="980" cy="45" r="1"/><circle cx="1150" cy="100" r="2"/>
    <circle cx="1420" cy="55" r="1.5"/><circle cx="1650" cy="140" r="1"/><circle cx="1870" cy="70" r="2"/>
    <circle cx="2100" cy="110" r="1.5"/><circle cx="2300" cy="50" r="1"/><circle cx="2480" cy="130" r="2"/>
    <circle cx="200" cy="300" r="1"/><circle cx="450" cy="400" r="1.5"/><circle cx="700" cy="280" r="1"/>
    <circle cx="1050" cy="350" r="2"/><circle cx="1500" cy="290" r="1"/><circle cx="1750" cy="380" r="1.5"/>
    <circle cx="2000" cy="310" r="1"/><circle cx="2250" cy="420" r="2"/><circle cx="2450" cy="280" r="1.5"/>
    <circle cx="150" cy="900" r="1.5"/><circle cx="400" cy="1000" r="1"/><circle cx="650" cy="850" r="2"/>
    <circle cx="900" cy="1100" r="1"/><circle cx="1100" cy="950" r="1.5"/><circle cx="1600" cy="900" r="1"/>
    <circle cx="1800" cy="1050" r="2"/><circle cx="2050" cy="870" r="1.5"/><circle cx="2300" cy="1000" r="1"/>
    <circle cx="2500" cy="920" r="2"/><circle cx="300" cy="1200" r="1"/><circle cx="600" cy="1300" r="1.5"/>
    <circle cx="900" cy="1380" r="1"/><circle cx="1200" cy="1250" r="2"/><circle cx="1700" cy="1320" r="1"/>
    <circle cx="2000" cy="1180" r="1.5"/><circle cx="2350" cy="1350" r="1"/><circle cx="80" cy="600" r="1.5"/>
    <circle cx="2480" cy="700" r="2"/><circle cx="50" cy="1100" r="1"/><circle cx="2520" cy="400" r="1.5"/>
  </g>

  <!-- Estrelas médias (brilho suave) -->
  <g fill="white" opacity="0.6" filter="url(#glow)">
    <circle cx="220" cy="220" r="2"/><circle cx="800" cy="350" r="2.5"/><circle cx="1900" cy="200" r="2"/>
    <circle cx="2380" cy="850" r="2.5"/><circle cx="400" cy="1150" r="2"/><circle cx="2100" cy="1200" r="2.5"/>
    <circle cx="1100" cy="1350" r="2"/><circle cx="600" cy="700" r="2.5"/>
  </g>

  <!-- Linha decorativa esquerda -->
  <line x1="0" y1="720" x2="750" y2="720" stroke="#4338ca" stroke-width="1" opacity="0.3"/>
  <!-- Linha decorativa direita -->
  <line x1="1810" y1="720" x2="2560" y2="720" stroke="#4338ca" stroke-width="1" opacity="0.3"/>

  <!-- Glow da estrela -->
  <ellipse cx="1280" cy="720" rx="180" ry="180" fill="url(#starGlow)" opacity="0.5"/>

  <!-- Símbolo VERA — estrela de 4 pontas (escala 3.5x, centro 1280,720) -->
  <g transform="translate(1280, 720) scale(3.5)" filter="url(#softGlow)">
    <!-- Sombra/glow dourado -->
    <path d="M0,-34 L5,-5 L34,0 L5,5 L0,34 L-5,5 L-34,0 L-5,-5 Z"
          fill="#d97706" opacity="0.4" transform="scale(1.3)"/>
    <!-- Estrela principal — facetada clara -->
    <path d="M0,-34 L4,-4 L34,0 L4,4 L0,34 L-4,4 L-34,0 L-4,-4 Z"
          fill="#d97706"/>
    <!-- Destaque interno claro -->
    <path d="M0,-22 L2.5,-2.5 L22,0 L2.5,2.5 L0,22 L-2.5,2.5 L-22,0 L-2.5,-2.5 Z"
          fill="#f5c06a" opacity="0.7"/>
  </g>

  <!-- Círculo fino ao redor da estrela -->
  <circle cx="1280" cy="720" r="148" fill="none" stroke="#4338ca" stroke-width="1.5" opacity="0.5"/>
  <circle cx="1280" cy="720" r="155" fill="none" stroke="#d97706" stroke-width="0.5" opacity="0.3"/>

  <!-- Nome VERA -->
  <text x="1280" y="630"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="126"
        font-weight="bold"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="42"
        opacity="0.95">VERA</text>

  <!-- Linha divisória acima do slogan -->
  <line x1="1030" y1="860" x2="1530" y2="860" stroke="#d97706" stroke-width="1" opacity="0.5"/>

  <!-- Slogan -->
  <text x="1280" y="905"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="36"
        fill="#d97706"
        text-anchor="middle"
        letter-spacing="10"
        opacity="0.9">DE VERDADE.</text>

  <!-- Tagline -->
  <text x="1280" y="955"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="24"
        fill="#818cf8"
        text-anchor="middle"
        letter-spacing="3"
        opacity="0.7">a religião de quem não tem religião</text>

  <!-- Site -->
  <text x="1280" y="1020"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="20"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="2"
        opacity="0.4">somosvera.com.br</text>

  <!-- Pontos de acento nos cantos (decorativos) -->
  <g fill="#d97706" opacity="0.3">
    <polygon points="60,60 75,68 68,84 52,84 45,68" transform="rotate(0,60,72)"/>
    <polygon points="2500,60 2515,68 2508,84 2492,84 2485,68"/>
    <polygon points="60,1370 75,1378 68,1394 52,1394 45,1378"/>
    <polygon points="2500,1370 2515,1378 2508,1394 2492,1394 2485,1378"/>
  </g>
</svg>
