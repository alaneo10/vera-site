<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2d2a6e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Glow da estrela -->
  <circle cx="250" cy="250" r="160" fill="url(#glow)"/>

  <!-- Estrelas de fundo -->
  <g fill="white" opacity="0.5">
    <circle cx="60" cy="70" r="1.5"/><circle cx="150" cy="40" r="1"/><circle cx="380" cy="60" r="1.5"/>
    <circle cx="450" cy="120" r="1"/><circle cx="80" cy="400" r="1.5"/><circle cx="420" cy="380" r="1"/>
    <circle cx="40" cy="250" r="1"/><circle cx="460" cy="260" r="1.5"/><circle cx="200" cy="470" r="1"/>
    <circle cx="350" cy="450" r="1.5"/><circle cx="130" cy="180" r="1"/><circle cx="390" cy="200" r="1"/>
  </g>

  <!-- Círculo decorativo -->
  <circle cx="250" cy="250" r="155" fill="none" stroke="#4338ca" stroke-width="1.5" opacity="0.5"/>

  <!-- Glow suave atrás da estrela -->
  <path d="M250,116 L259,241 L384,250 L259,259 L250,384 L241,259 L116,250 L241,241 Z"
        fill="#d97706" opacity="0.3" filter="url(#blur)"/>

  <!-- Estrela de 4 pontas -->
  <path d="M250,116 L258,242 L384,250 L258,258 L250,384 L242,258 L116,250 L242,242 Z"
        fill="#d97706"/>
  <!-- Destaque interno -->
  <path d="M250,162 L256,244 L338,250 L256,256 L250,338 L244,256 L162,250 L244,244 Z"
        fill="#f5c06a" opacity="0.6"/>
</svg>
