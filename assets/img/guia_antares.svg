<svg xmlns="http://www.w3.org/2000/svg" viewBox="-75 -75 150 150" width="300" height="300">
<title>Antares — Encantamento · pergunta que acorda</title>
<style>
  .camada1, .camada2, .camada3, .camada4, .assinatura { transform-box: fill-box; transform-origin: center; }
  .camada1 { animation: brasa1 6.5s ease-in-out infinite; }
  .camada2 { animation: brasa2 5.2s ease-in-out infinite; }
  .camada3 { animation: brasa3 4.1s ease-in-out infinite; }
  .camada4 { animation: brasa2 3.4s ease-in-out infinite reverse; }
  @keyframes brasa1 { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes brasa2 { 0%,100% { transform: scale(1) translate(0,0); } 50% { transform: scale(1.07) translate(1px,-1px); } }
  @keyframes brasa3 { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.94); opacity: 0.9; } }
  .flare { animation: flareViva 7s ease-in-out infinite; }
  .flare.f2 { animation-delay: 3.5s; }
  @keyframes flareViva { 0%,100% { opacity: 0.15; } 12% { opacity: 0.6; } 30% { opacity: 0.3; } 55% { opacity: 0.55; } 75% { opacity: 0.2; } }
  .assinatura { animation: cintila 3.1s ease-in-out infinite; }
  @keyframes cintila { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.7; } }
</style>
<g class="camada1"><ellipse rx="50" ry="44" fill="#7c2d12" opacity="0.55"/></g>
<g class="camada2"><ellipse cx="3" cy="-3" rx="40" ry="35" fill="#9a3412" opacity="0.75"/></g>
<g class="camada3"><ellipse cx="-1" cy="1" rx="30" ry="27" fill="#c2410c"/></g>
<g class="camada4"><ellipse cx="-3" cy="2" rx="19" ry="17" fill="#ea580c"/></g>
<circle cx="-2" cy="0" r="9" fill="#fb923c"/>
<path class="flare" d="M52,-30 Q60,-36 64,-46" stroke="#ea580c" stroke-width="1.5" fill="none"/>
<path class="flare f2" d="M-54,26 Q-62,32 -64,42" stroke="#ea580c" stroke-width="1.5" fill="none"/>
<g transform="translate(7,-7)">
  <path class="assinatura" d="M0,-7 L1,-1 L7,0 L1,1 L0,7 L-1,1 L-7,0 L-1,-1 Z" fill="#fff7ed"/>
</g>
</svg>
